     글·메신저에 박제된 악보 주소는 전부 루트를 가리킨다: umulsai.com/#v=… (게시) · #s=… (옛 링크 공유)
     · #va=… (관리자로 열기) · ?first=1 (온보딩 다시 보기). 해시는 서버에 안 가므로 여기서 JS로 넘긴다.
     그리는 것보다 먼저 넘겨야 첫 화면이 번쩍 비치지 않는다(그래서 head 맨 앞 · 동기 스크립트).
     ★ 주소 형식을 늘리면 editor.html 쪽 app.js의 incomingDoc과 **이 정규식을 함께** 고칠 것. -->
<script>
(function () {
  var h = location.hash, q = location.search;
  if (/^#(s|va?)=/.test(h) || /[?&]first=/.test(q)) location.replace("editor.html" + q + h);
})();
</script>
